<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>You’re offline · DASYIN ERP</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --border: #e6e8ef;
        --text: #111322;
        --text-2: #475067;
        --text-3: #7b839a;
        --accent: #5b4cf0;
        --accent-soft: #efedff;
        --accent-contrast: #fff;
        --warning: #d97706;
        --warning-soft: #fdf3e2;
        --success: #12a150;
        color-scheme: light;
      }
      [data-theme='dark'] {
        --bg: #0b0d14;
        --surface: #121521;
        --border: #242a3b;
        --text: #eef0f7;
        --text-2: #b3b9cc;
        --text-3: #7e869d;
        --accent: #8b7fff;
        --accent-soft: rgba(139, 127, 255, 0.14);
        --accent-contrast: #0d0b1f;
        --warning: #f5a524;
        --warning-soft: rgba(245, 165, 36, 0.14);
        --success: #3ccf7e;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 36px 28px 28px;
        box-shadow: 0 20px 40px -18px rgba(16, 24, 40, 0.18);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 17px;
      }
      .brand svg {
        width: 34px;
        height: 34px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: var(--warning-soft);
        color: var(--warning);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: var(--text-2);
        line-height: 1.55;
        font-size: 15px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-contrast);
        font: inherit;
        font-weight: 650;
        font-size: 15px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 2px;
      }
      .tips {
        margin: 22px 0 0;
        padding: 0;
        list-style: none;
        text-align: left;
        font-size: 13.5px;
        color: var(--text-3);
        display: grid;
        gap: 8px;
      }
      .tips li {
        display: flex;
        gap: 10px;
      }
      .tips li::before {
        content: '•';
        color: var(--accent);
      }
      .status {
        margin-top: 18px;
        font-size: 13px;
        color: var(--text-3);
        min-height: 18px;
      }
      .status.is-online {
        color: var(--success);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="brand">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7c6bff" />
                <stop offset=".45" stop-color="#5b4cf0" />
                <stop offset="1" stop-color="#2f86ff" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="18" fill="url(#g)" />
            <path d="M36.4 9.5 16.6 35.2c-.8 1-.1 2.5 1.2 2.5H29l-3.3 15.4c-.3 1.5 1.6 2.4 2.6 1.2l19.8-25.7c.8-1 .1-2.5-1.2-2.5H35.8l3.2-15.4c.4-1.5-1.6-2.4-2.6-1.2Z" fill="#fff" />
          </svg>
          DASYIN
        </div>
        <div class="icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 2l20 20" />
            <path d="M8.5 16.5a5 5 0 0 1 7 0" />
            <path d="M2 8.82a15 15 0 0 1 4.17-2.65" />
            <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
            <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68" />
            <path d="M5 13a10 10 0 0 1 5.24-2.76" />
            <path d="M12 20h.01" />
          </svg>
        </div>
        <h1>You’re offline</h1>
        <p>DASYIN can’t reach the internet right now. Your data is safe — nothing you saved has been lost.</p>
        <button type="button" id="retry">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
          Try again
        </button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <ul class="tips">
          <li>Check Wi-Fi or mobile data.</li>
          <li>This page reloads by itself when you’re back online.</li>
        </ul>
      </div>
    </main>
    <script>
      ;(function () {
        var status = document.getElementById('status')
        function go() {
          location.reload()
        }
        document.getElementById('retry').addEventListener('click', function () {
          status.textContent = navigator.onLine ? 'Reconnecting…' : 'Still offline — we’ll retry automatically.'
          if (navigator.onLine) go()
        })
        window.addEventListener('online', function () {
          status.textContent = 'Back online — reloading…'
          status.className = 'status is-online'
          setTimeout(go, 600)
        })
      })()
    </script>
  </body>
</html>
