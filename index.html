<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="version" content="%APP_VERSION%" />
    <meta name="application-name" content="DASYIN ERP" />
    <link rel="icon" href="/favicon.ico?v=%APP_VERSION%" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=%APP_VERSION%" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=%APP_VERSION%" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=%APP_VERSION%" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest?v=%APP_VERSION%" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DASYIN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="DASYIN ERP — bookings, invoicing, inventory and operations in one place." />
    <title>DASYIN ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.setAttribute('data-bs-theme', t)
        // Browser chrome (mobile address bar / PWA title bar) follows the app theme
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', t === 'dark' ? '#0b0d14' : '#f6f7fb') })
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
